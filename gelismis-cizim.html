
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gelişmiş Hayalet Çizim</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111;color:white;font-family:Arial;text-align:center}
header{padding:15px;font-size:22px;font-weight:bold;background:#222}
#stage{position:relative;width:100%;height:65vh;background:#000;overflow:hidden}
#camera,#overlay{position:absolute;width:100%;height:100%;inset:0}
#camera{object-fit:cover}
#overlay{object-fit:contain;opacity:.5;touch-action:none;transform-origin:center}
.controls{padding:14px;display:grid;gap:12px}
button{padding:13px;border:0;border-radius:9px;background:#1685ee;color:white;font-size:16px}
input{width:100%}
label{display:block;text-align:left}
</style>
</head>
<body>
<header>🎨 HAYALET ÇİZİM</header>
<div id="stage">
<video id="camera" autoplay playsinline muted></video>
<img id="overlay" hidden>
</div>
<div class="controls">
<button onclick="startCamera()">📷 Kamerayı Aç</button>
<button onclick="document.getElementById('file').click()">🖼️ Galeriden Fotoğraf Seç</button>
<input id="file" type="file" accept="image/*" hidden>
<label>Şeffaflık <input id="opacity" type="range" min="0.1" max="1" step="0.05" value="0.5"></label>
<label>Boyut <input id="scale" type="range" min="0.3" max="3" step="0.05" value="1"></label>
<button onclick="resetImage()">Fotoğrafı Sıfırla</button>
<button onclick="capture()">📸 Görüntüyü Kaydet</button>
</div>
<script>
const video=document.getElementById('camera');
const overlay=document.getElementById('overlay');
const stage=document.getElementById('stage');
let x=0,y=0,scale=1,drag=false,sx=0,sy=0;
async function startCamera(){
try{
const stream=await navigator.mediaDevices.getUserMedia({
video:{facingMode:'environment'},audio:false
});
video.srcObject=stream;
await video.play();
}catch(e){alert('Kamera açılamadı. Tarayıcı kamera izni gerekli.');}
}
document.getElementById('file').onchange=e=>{
const file=e.target.files[0];
if(file){
overlay.src=URL.createObjectURL(file);
overlay.hidden=false;
resetImage();
}
};
document.getElementById('opacity').oninput=e=>{
overlay.style.opacity=e.target.value;
};
document.getElementById('scale').oninput=e=>{
scale=Number(e.target.value);
update();
};
function update(){
overlay.style.transform=`translate(${x}px,${y}px) scale(${scale})`;
}
function resetImage(){
x=0;y=0;scale=1;
document.getElementById('scale').value=1;
overlay.style.opacity=document.getElementById('opacity').value;
update();
}
overlay.addEventListener('pointerdown',e=>{
drag=true;sx=e.clientX-x;sy=e.clientY-y;
overlay.setPointerCapture(e.pointerId);
});
overlay.addEventListener('pointermove',e=>{
if(!drag)return;
x=e.clientX-sx;y=e.clientY-sy;update();
});
overlay.addEventListener('pointerup',()=>drag=false);
overlay.addEventListener('pointercancel',()=>drag=false);
async function capture(){
if(!video.videoWidth){alert('Önce kamerayı aç.');return;}
const canvas=document.createElement('canvas');
canvas.width=video.videoWidth;
canvas.height=video.videoHeight;
const ctx=canvas.getContext('2d');
ctx.drawImage(video,0,0,canvas.width,canvas.height);
if(!overlay.hidden){
const rect=stage.getBoundingClientRect();
const r=overlay.getBoundingClientRect();
const ratio=canvas.width/rect.width;
ctx.globalAlpha=Number(document.getElementById('opacity').value);
ctx.drawImage(overlay,
(r.left-rect.left)*ratio,
(r.top-rect.top)*ratio,
r.width*ratio,r.height*ratio);
}
const a=document.createElement('a');
a.download='hayalet-cizim.png';
a.href=canvas.toDataURL('image/png');
a.click();
}
</script>
</body>
</html>
