
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hayalet Çizim Pro</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101010;color:white;font-family:Arial}
header{text-align:center;padding:16px;font-size:22px;font-weight:bold}
#stage{position:relative;width:100%;height:58vh;background:#000;overflow:hidden}
#camera{position:absolute;width:100%;height:100%;object-fit:cover}
#ghost{position:absolute;width:65%;height:auto;max-height:90%;object-fit:contain;left:50%;top:50%;transform:translate(-50%,-50%);opacity:.5;touch-action:none}
.controls{padding:15px;display:grid;gap:13px}
button{padding:14px;border:0;border-radius:10px;background:#1685ee;color:white;font-size:16px}
label{font-size:14px}
input[type=range]{width:100%}
</style>
</head>
<body>
<header>🎨 HAYALET ÇİZİM PRO</header>
<div id="stage">
<video id="camera" autoplay muted playsinline></video>
<img id="ghost" hidden>
</div>
<div class="controls">
<button onclick="openCamera()">📷 KAMERAYI AÇ</button>
<button onclick="document.getElementById('photo').click()">🖼️ GALERİDEN FOTOĞRAF SEÇ</button>
<input type="file" id="photo" accept="image/*" hidden>
<label>👁️ Şeffaflık
<input id="opacity" type="range" min="0.05" max="1" step="0.05" value="0.4">
</label>
<label>🔍 Fotoğraf Boyutu
<input id="size" type="range" min="20" max="150" value="65">
</label>
<button onclick="resetGhost()">↩️ FOTOĞRAFI SIFIRLA</button>
</div>
<script>
const camera=document.getElementById('camera');
const ghost=document.getElementById('ghost');
async function openCamera(){
try{
const s=await navigator.mediaDevices.getUserMedia({
video:{facingMode:{ideal:'environment'}},audio:false
});
camera.srcObject=s;
await camera.play();
}catch(e){alert('Kamera izni verilemedi. Chrome kamera iznini kontrol et.');}
}
document.getElementById('photo').addEventListener('change',e=>{
const f=e.target.files[0];
if(!f)return;
ghost.src=URL.createObjectURL(f);
ghost.hidden=false;
});
document.getElementById('opacity').addEventListener('input',e=>{
ghost.style.opacity=e.target.value;
});
document.getElementById('size').addEventListener('input',e=>{
ghost.style.width=e.target.value+'%';
});
function resetGhost(){
ghost.style.opacity=.4;
ghost.style.width='65%';
document.getElementById('opacity').value=.4;
document.getElementById('size').value=65;
ghost.style.left='50%';
ghost.style.top='50%';
ghost.style.transform='translate(-50%,-50%)';
}
let moving=false,dx=0,dy=0;
ghost.addEventListener('pointerdown',e=>{
moving=true;
const r=ghost.getBoundingClientRect();
dx=e.clientX-r.left;
dy=e.clientY-r.top;
ghost.style.transform='none';
ghost.setPointerCapture(e.pointerId);
});
ghost.addEventListener('pointermove',e=>{
if(!moving)return;
const r=document.getElementById('stage').getBoundingClientRect();
ghost.style.left=(e.clientX-dx-r.left)+'px';
ghost.style.top=(e.clientY-dy-r.top)+'px';
});
ghost.addEventListener('pointerup',()=>moving=false);
ghost.addEventListener('pointercancel',()=>moving=false);
</script>
</body>
</html>
